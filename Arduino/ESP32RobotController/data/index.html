<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32 Robot</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#101827;color:#e5e7eb}body{margin:0;padding:20px;max-width:1000px;margin:auto}h1{font-size:1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:16px}.muted{color:#9ca3af;font-size:.85rem}.value{font-size:1.5rem;font-weight:700;margin-top:8px}button,select,input{background:#111827;color:#e5e7eb;border:1px solid #4b5563;border-radius:7px;padding:9px;margin:4px}button{cursor:pointer}button.stop{background:#7f1d1d}button.go{background:#14532d}label{display:block;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
</style></head><body><h1>ESP32 Robot Control</h1><p class="muted">Live status · refreshes every 500 ms</p><div class="grid">
<div class="card">MODE<div class="value" id="mode">—</div></div><div class="card">MOTOR<div class="value" id="motor">—</div></div><div class="card">DISTANCE<div class="value" id="distance">—</div></div><div class="card">IR SENSOR<div class="value" id="ir">—</div></div><div class="card">BUZZER / BUILT-IN LED<div class="value" id="outputs">—</div></div><div class="card">LED OUTPUTS<div class="value" id="leds">—</div></div></div>
<div class="card" style="margin-top:12px"><h3>Configuration</h3><label>Mode <select id="modeSelect"><option>both</option><option>ir</option><option>ultrasonic</option><option>constant</option></select></label>
<label>Stop distance (cm) <input id="stop_distance" type="number" min="1" max="400" value="5"></label><label>Red limit (cm) <input id="red_limit" type="number" min="1" max="400" value="5"></label><label>Yellow limit (cm) <input id="yellow_limit" type="number" min="2" max="400" value="10"></label><label>Motor speed <input id="motor_speed" type="number" min="0" max="255" value="200"></label><label>Log level <select id="log_level"><option>error</option><option selected>status</option><option>info</option><option>debug</option><option>trace</option></select></label>
<button class="go" onclick="save()">Apply</button><button onclick="post('/api/config/save')">Save</button><button onclick="post('/api/config/reset')">Reset defaults</button><p><button class="go" onclick="post('/api/motor/start')">Request motor start</button><button class="stop" onclick="post('/api/motor/stop')">Stop motor</button></p><p class="muted" id="message">Ready</p></div><div class="card" style="margin-top:12px"><h3>Recent logs</h3><pre id="logs">Loading…</pre></div>
<script>
const $=id=>document.getElementById(id);async function get(p){let r=await fetch(p);return r.json()}function msg(s){$('message').textContent=s}
async function post(p){try{let r=await fetch(p,{method:'POST'});let j=await r.json();msg(j.ok?'Request accepted':j.error||'Error');refresh()}catch(e){msg(e)}}
async function save(){let body={mode:$('modeSelect').value,stop_distance:+$('stop_distance').value,red_limit:+$('red_limit').value,yellow_limit:+$('yellow_limit').value,motor_speed:+$('motor_speed').value,log_level:$('log_level').value};try{let r=await fetch('/api/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();msg(j.ok?'Configuration applied':j.error||'Rejected')}catch(e){msg(e)}refresh()}
async function refresh(){try{let s=await get('/api/status');$('mode').textContent=s.mode;$('motor').textContent=s.motor.running?'RUNNING':'STOPPED';$('distance').textContent=s.sensors.ultrasonic.distance_cm==null?'Invalid':s.sensors.ultrasonic.distance_cm.toFixed(1)+' cm';$('ir').textContent=s.sensors.ir.obstacle?'OBSTACLE':'CLEAR';$('outputs').textContent=(s.outputs.buzzer?'BUZZER ON':'BUZZER OFF')+' / '+(s.outputs.builtin_led?'BUILTIN ON':'BUILTIN OFF');$('leds').textContent=['R '+(s.outputs.red?'ON':'OFF'),'Y '+(s.outputs.yellow?'ON':'OFF'),'G '+(s.outputs.green?'ON':'OFF')].join(' · ');let c=await get('/api/config');$('modeSelect').value=c.mode;$('stop_distance').value=c.stop_distance;$('red_limit').value=c.red_limit;$('yellow_limit').value=c.yellow_limit;$('motor_speed').value=c.motor_speed;$('log_level').value=c.log_level;let l=await get('/api/logs');$('logs').textContent=l.logs.join('\n')}catch(e){msg('API unavailable: '+e)}}refresh();setInterval(refresh,500);
</script></body></html>
